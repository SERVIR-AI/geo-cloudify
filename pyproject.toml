[project]
name = "geo-cloudify"
version = "0.1.0"
description = "Convert geospatial files to cloud-optimized formats and check the result"
readme = "README.md"
authors = [
    { name = "Arif Syraj", email = "126988341+arif-syr@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
geo-cloudify = "geo_cloudify:main"

[project.optional-dependencies]
cog = [
    "numpy>=2.5.4",
    "rasterio>=1.5.2",
    "rio-cogeo>=7.0.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
