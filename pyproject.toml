[project]
name = "geo-cloudify"
version = "0.1.0"
description = "Convert geospatial files to cloud-optimized formats and check the result"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "rasterio>=1.5.2",
    "rio-cogeo>=7.0.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
# Standalone proofs of concept, not part of the package and not held to its rules (AGENTS.md).
extend-exclude = ["scripts"]

[tool.ruff.lint]
# Style errors, undefined and unused names, import order, likely bugs, and syntax Python 3.12 has a newer form for.
select = ["E", "W", "F", "I", "B", "UP"]
